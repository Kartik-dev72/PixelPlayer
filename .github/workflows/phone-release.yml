name: Build Phone APK (Release)

on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-phone:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache keystore
        id: cache-keystore
        uses: actions/cache@v5
        with:
          path: vz-pixelplay.jks
          key: ${{ runner.os }}-keystore-vz-pixelplay

      # This is not the official release key.
      # These APKs are universal and manually uploaded.
      - name: Generate keystore if not cached
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v \
            -keystore vz-pixelplay.jks \
            -alias pixelplay-key \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass 994273 \
            -keypass 994273 \
            -dname "CN=PixelPlay, OU=Dev, O=PixelPlay, L=World, S=World, C=US"

      - name: Create keystore.properties
        run: |
          echo "storePassword=994273" > keystore.properties
          echo "keyAlias=pixelplay-key" >> keystore.properties
          echo "keyPassword=994273" >> keystore.properties

      - name: Build universal Phone release APK
        run: |
          gradle :app:assembleRelease -Ppixelplay.enableAbiSplits=false

      - name: Verify universal APK
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Universal APK not found at $APK"
            echo "Available APKs:"
            find app/build/outputs/apk/release -type f -name "*.apk" -print
            exit 1
          fi

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$APK"

      - name: Upload Universal Phone APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PixelPlay-phone-release-universal
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
